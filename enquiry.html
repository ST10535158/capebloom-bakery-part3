<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Send a product or custom bakery enquiry to Cape Bloom Bakery."><meta name="keywords" content="bakery enquiry, custom cake enquiry, Cape Bloom Bakery"><title>Enquiry | Cape Bloom Bakery</title><link rel="stylesheet" href="css/style.css"></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html">Cape Bloom Bakery</a><button class="menu-toggle" aria-expanded="false" aria-controls="mainNav">Menu</button><nav id="mainNav"><ul class="nav-list"><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="products.html">Products</a></li><li><a class="active" href="enquiry.html">Enquiry</a></li><li><a href="contact.html">Contact</a></li></ul></nav></div></header><main id="main"><section class="page-hero"><div class="container"><p class="eyebrow">Let's plan your order</p><h1>Product Enquiry</h1><p>Complete the form and the page will validate your details before showing a response.</p></div></section><section class="section"><div class="container form-container"><form id="enquiryForm" novalidate><div class="form-group"><label for="enquiryName">Full name *</label><input id="enquiryName" name="name" type="text" required minlength="2"><small class="error" data-error-for="enquiryName"></small></div><div class="form-group"><label for="enquiryEmail">Email address *</label><input id="enquiryEmail" name="email" type="email" required><small class="error" data-error-for="enquiryEmail"></small></div><div class="form-group"><label for="enquiryPhone">Phone number *</label><input id="enquiryPhone" name="phone" type="tel" required pattern="[0-9 +()-]{7,}"><small class="error" data-error-for="enquiryPhone"></small></div><div class="form-group"><label for="enquiryProduct">Product/category *</label><select id="enquiryProduct" name="product" required><option value="">Select an option</option><option>Bread</option><option>Cakes</option><option>Cupcakes</option><option>Pastries</option><option>Custom order</option></select><small class="error" data-error-for="enquiryProduct"></small></div><div class="form-group"><label for="enquiryMessage">Your requirements *</label><textarea id="enquiryMessage" name="message" rows="6" required minlength="10"></textarea><small class="error" data-error-for="enquiryMessage"></small></div><button class="button" type="submit">Submit Enquiry</button><p id="enquiryResponse" class="form-response" aria-live="polite"></p></form></div></section></main><footer class="site-footer"><div class="container"><p>&copy; 2026 Cape Bloom Bakery. Academic project.</p></div></footer><script src="js/script.js"></script></body></html>
